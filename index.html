<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KABUKI JOKI - Joki ML &amp; Top Up Game</title>
  <style>
    :root {
      --bg-main: #111214;
      --bg-surface: #181a1f;
      --bg-card: #1d2129;
      --accent: #1d74f5;
      --accent-bright: #3b82f6;
      --cyan-edge: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-soft: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* Top Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(17, 18, 20, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1d74f5, #0ea5e9);
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
    }

    .search-wrap {
      flex: 1;
      min-width: 0;
    }

    .search-input {
      width: 100%;
      height: 34px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-bright);
    }

    .region-tag {
      height: 34px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    /* Main Container */
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 14px 0;
    }

    /* Category Tabs (2 Katalog) */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent-bright);
      color: #ffffff;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
    }

    .section-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 9px;
      }
    }

    /* Card Style */
    .card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      background: linear-gradient(180deg, #1b222e 0%, #151b26 100%);
      border-radius: 12px;
      padding: 6px;
      border: 1px solid rgba(56, 189, 248, 0.22);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--cyan-edge);
    }

    .thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 4.3;
      border-radius: 9px;
      overflow: hidden;
      background: #0d131c;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-tag {
      position: absolute;
      left: 50%;
      bottom: 7px;
      transform: translateX(-50%);
      background: rgba(10, 22, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.55);
      color: #e0f2fe;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 5px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .card-body {
      padding: 8px 4px 4px;
      text-align: center;
    }

    .card-title {
      font-size: 11.5px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 2px;
    }

    .card-sub {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.25;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      background: var(--bg-surface);
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand">
      <div class="brand-mark">KJ</div>
      <span>KABUKI JOKI</span>
    </a>
    <div class="search-wrap">
      <input
        id="search-input"
        type="search"
        class="search-input"
        placeholder="Cari Joki ML atau Top Up Game..."
        autocomplete="off"
      />
    </div>
    <div class="region-tag">🇮🇩 ID / IDR</div>
  </header>

  <main class="container">
    <div class="tabs" id="category-tabs">
      <button type="button" class="tab-btn active" data-cat="joki-ml">⚔️ Joki ML</button>
      <button type="button" class="tab-btn" data-cat="topup-game">🎮 Top Up Game</button>
    </div>

    <div class="section-header">
      <h1 id="section-title" class="section-title">Joki Mobile Legends</h1>
      <span id="section-count" class="section-count"></span>
    </div>

    <div id="catalog-grid" class="grid"></div>
  </main>

  <script>
    function makePoster(label, badge, c1, c2) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="340" viewBox="0 0 320 340">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${c1}"/>
            <stop offset="100%" stop-color="${c2}"/>
          </linearGradient>
        </defs>
        <rect width="320" height="340" fill="url(#bg)"/>
        <polygon points="160,42 255,105 225,225 95,225 65,105" fill="rgba(255,255,255,0.08)" stroke="rgba(125,211,252,0.45)" stroke-width="2"/>
        <text x="160" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="38" font-weight="900" fill="#ffffff">${label}</text>
        <text x="160" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#bae6fd" letter-spacing="2">${badge}</text>
      </svg>`;
      return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
    }

    const ITEMS = [
      // KATALOG 1: JOKI ML
      {
        id: "joki-rank",
        cat: "joki-ml",
        tag: "JOKI RANK",
        title: "Joki Rank",
        sub: "Jasa Joki (Up Rank)",
        image: makePoster("RANK", "MOBILE LEGENDS", "#1e3a8a", "#0f172a")
      },
      {
        id: "joki-hero-mmr",
        cat: "joki-ml",
        tag: "HERO MMR",
        title: "Jasa Joki Ranked",
        sub: "1 Hero (Up MMR)",
        image: makePoster("MMR", "TITLE HERO", "#312e81", "#090d16")
      },
      {
        id: "jasa-gendong",
        cat: "joki-ml",
        tag: "GENDONG",
        title: "Jasa Mabar / Gendong",
        sub: "Main Bareng Pro",
        image: makePoster("MABAR", "PARTY RANK", "#0369a1", "#082f49")
      },
      {
        id: "joki-classic",
        cat: "joki-ml",
        tag: "CLASSIC WR",
        title: "Joki Classic",
        sub: "Up Winrate Hero",
        image: makePoster("WR %", "CLASSIC MODE", "#1d4ed8", "#172554")
      },
      {
        id: "joki-magic-chess",
        cat: "joki-ml",
        tag: "MAGIC CHESS",
        title: "Joki Magic Chess",
        sub: "Push Rank Magic Chess",
        image: makePoster("CHESS", "STRATEGY MODE", "#0f766e", "#042f2e")
      },
      {
        id: "joki-montage",
        cat: "joki-ml",
        tag: "MONTAGE",
        title: "Joki Video Montage",
        sub: "Jasa Video Highlight",
        image: makePoster("CLIP", "HIGHLIGHT ML", "#6d28d9", "#2e1065")
      },

      // KATALOG 2: TOP UP GAME
      {
        id: "topup-mlbb",
        cat: "topup-game",
        tag: "DIAMONDS",
        title: "Mobile Legends",
        sub: "Diamonds & Weekly Pass",
        image: makePoster("MLBB", "DIAMONDS", "#1d4ed8", "#0f172a")
      },
      {
        id: "topup-ff",
        cat: "topup-game",
        tag: "DIAMONDS",
        title: "Free Fire",
        sub: "Diamond & Membership",
        image: makePoster("FF", "DIAMONDS", "#c2410c", "#1c1917")
      },
      {
        id: "topup-ff-max",
        cat: "topup-game",
        tag: "TOP UP",
        title: "Free Fire Max",
        sub: "Diamond Instan",
        image: makePoster("FF MAX", "DIAMONDS", "#b45309", "#1c1917")
      },
      {
        id: "topup-pubgm",
        cat: "topup-game",
        tag: "UC",
        title: "PUBG Mobile",
        sub: "Unknown Cash (UC)",
        image: makePoster("PUBGM", "UC INSTAN", "#0369a1", "#090d16")
      },
      {
        id: "topup-hok",
        cat: "topup-game",
        tag: "TOKENS",
        title: "Honor of Kings",
        sub: "Tokens Resmi",
        image: makePoster("HOK", "TOKENS", "#7e22ce", "#1e1b4b")
      },
      {
        id: "topup-genshin",
        cat: "topup-game",
        tag: "GENESIS",
        title: "Genshin Impact",
        sub: "Genesis Crystals & Welkin",
        image: makePoster("GI", "CRYSTALS", "#0f766e", "#042f2e")
      }
    ];

    let currentCat = "joki-ml";
    let keyword = "";

    const tabs = document.querySelectorAll(".tab-btn");
    const grid = document.getElementById("catalog-grid");
    const titleEl = document.getElementById("section-title");
    const countEl = document.getElementById("section-count");
    const searchInput = document.getElementById("search-input");

    function render() {
      const q = keyword.trim().toLowerCase();
      const filtered = ITEMS.filter((item) => {
        const matchCat = q ? true : item.cat === currentCat;
        const matchText =
          !q ||
          item.title.toLowerCase().includes(q) ||
          item.sub.toLowerCase().includes(q) ||
          item.tag.toLowerCase().includes(q);
        return matchCat && matchText;
      });

      titleEl.textContent = q
        ? "Hasil Pencarian"
        : currentCat === "joki-ml"
        ? "Joki Mobile Legends"
        : "Top Up Game";

      countEl.textContent = `${filtered.length} item`;

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty">Item tidak ditemukan.</div>`;
        return;
      }

      grid.innerHTML = filtered
        .map(
          (item) => `
          <a href="order.html?id=${encodeURIComponent(item.id)}" class="card">
            <div class="thumb-box">
              <img src="${item.image}" alt="${item.title}" loading="lazy" />
              <span class="thumb-tag">${item.tag}</span>
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <div class="card-sub">${item.sub}</div>
            </div>
          </a>
        `
        )
        .join("");
    }

    tabs.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabs.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentCat = btn.dataset.cat;
        searchInput.value = "";
        keyword = "";
        render();
      });
    });

    searchInput.addEventListener("input", (e) => {
      keyword = e.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
