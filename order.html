<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Layanan - KABUKI JOKI</title>
  <style>
    :root {
      --bg-main: #121316;
      --bg-panel: #181a1f;
      --bg-card: #19202b;
      --blue-main: #1d74f5;
      --blue-bright: #3b82f6;
      --cyan-accent: #38bdf8;
      --green-wa: #16a34a;
      --green-wa-bright: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-soft: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* Topbar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(18, 19, 22, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-soft);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 900;
      font-size: 13px;
    }

    .brand-badge {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
    }

    .back-btn {
      text-decoration: none;
      color: #e2e8f0;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      padding: 6px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .back-btn:hover {
      border-color: var(--cyan-accent);
    }

    /* Layout */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 14px 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 820px) {
      .container {
        grid-template-columns: 0.9fr 1.1fr;
        align-items: start;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 14px;
    }

    /* Service Info Card */
    .service-hero {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .service-img {
      width: 76px;
      height: 84px;
      border-radius: 9px;
      object-fit: cover;
      background: #0d131c;
      border: 1px solid rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }

    .cat-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #7dd3fc;
      background: rgba(29, 116, 245, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 5px;
    }

    .service-title {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.2;
    }

    .service-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .service-note {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 9px;
      padding: 10px 12px;
    }

    .step-title {
      font-size: 13.5px;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--blue-main);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      display: inline-grid;
      place-items: center;
    }

    /* Package Grid */
    .pkg-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    @media (min-width: 520px) {
      .pkg-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .pkg-btn {
      text-align: left;
      padding: 10px;
      border-radius: 9px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
      transition: border-color 0.14s ease, background 0.14s ease;
    }

    .pkg-btn:hover {
      border-color: var(--cyan-accent);
    }

    .pkg-btn.active {
      border-color: var(--cyan-accent);
      background: rgba(29, 116, 245, 0.22);
    }

    .pkg-name {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 3px;
    }

    .pkg-price {
      font-size: 11.5px;
      font-weight: 700;
      color: #7dd3fc;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 11px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--cyan-accent);
    }

    textarea {
      resize: vertical;
      min-height: 68px;
    }

    /* Summary Box */
    .summary-box {
      background: var(--bg-card);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 10px;
      padding: 11px 12px;
      margin: 14px 0;
      font-size: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .summary-row:last-child {
      margin-bottom: 0;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
    }

    .summary-val {
      color: #f8fafc;
      font-weight: 700;
      text-align: right;
    }

    .btn-wa {
      width: 100%;
      padding: 12px 14px;
      border-radius: 9px;
      border: none;
      background: var(--green-wa);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-wa:hover {
      background: var(--green-wa-bright);
      color: #052010;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand">
      <div class="brand-badge">KJ</div>
      <span>KABUKI JOKI</span>
    </a>
    <a href="index.html" class="back-btn">← Kembali ke Katalog</a>
  </header>

  <main class="container">
    <!-- Info Layanan -->
    <section class="panel">
      <div class="service-hero">
        <img id="svc-img" src="" alt="" class="service-img" onerror="this.onerror=null;this.src=FALLBACK_ART;" />
        <div>
          <span id="svc-cat" class="cat-pill">KATALOG</span>
          <h1 id="svc-title" class="service-title">Memuat Layanan...</h1>
          <div id="svc-sub" class="service-sub"></div>
        </div>
      </div>
      <div id="svc-note" class="service-note"></div>
    </section>

    <!-- Form Pemesanan -->
    <section class="panel">
      <div class="step-title">
        <span class="step-num">1</span>
        <span>Pilih Paket / Nominal</span>
      </div>
      <div id="pkg-grid" class="pkg-grid"></div>

      <div class="step-title">
        <span class="step-num">2</span>
        <span>Lengkapi Data Pesanan</span>
      </div>

      <form id="order-form">
        <!-- Field khusus Top Up -->
        <div id="topup-fields">
          <div class="form-row-2">
            <div class="form-group">
              <label for="game-id">User ID / Player ID</label>
              <input id="game-id" type="text" placeholder="Contoh: 123456789" required />
            </div>
            <div id="zone-wrap" class="form-group">
              <label for="zone-id">Server / Zone ID</label>
              <input id="zone-id" type="text" placeholder="Contoh: 2468" />
            </div>
          </div>
        </div>

        <!-- Field khusus Joki ML -->
        <div id="joki-fields" class="hidden">
          <div class="form-row-2">
            <div class="form-group">
              <label for="ml-id-server">ID &amp; Server MLBB</label>
              <input id="ml-id-server" type="text" placeholder="Contoh: 12345678 (2468)" />
            </div>
            <div class="form-group">
              <label for="login-via">Login Akun Via</label>
              <select id="login-via">
                <option value="Moonton">Moonton</option>
                <option value="VK">VK</option>
                <option value="TikTok">TikTok</option>
                <option value="Mabar / Party">Mabar / Party (Tanpa Login)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="email-pass">Email / ID Login &amp; Password (atau Nickname Mabar)</label>
            <input id="email-pass" type="text" placeholder="Isi sesuai metode login yang dipilih" />
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="wa-buyer">No. WhatsApp Kamu</label>
            <input id="wa-buyer" type="tel" placeholder="Contoh: 081234567890" required />
          </div>
          <div class="form-group">
            <label for="payment-method">Metode Pembayaran</label>
            <select id="payment-method">
              <option value="QRIS">QRIS (Semua E-Wallet &amp; Bank)</option>
              <option value="DANA">DANA</option>
              <option value="OVO">OVO</option>
              <option value="GoPay">GoPay</option>
              <option value="Transfer Bank">Transfer Bank</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Catatan Tambahan (Opsional)</label>
          <textarea id="notes" placeholder="Contoh: Request hero, jam main, atau catatan khusus..."></textarea>
        </div>

        <div class="summary-box">
          <div class="summary-row">
            <span>Layanan</span>
            <span id="sum-service" class="summary-val">-</span>
          </div>
          <div class="summary-row">
            <span>Paket Dipilih</span>
            <span id="sum-pkg" class="summary-val">-</span>
          </div>
          <div class="summary-row">
            <span>Pembayaran</span>
            <span id="sum-pay" class="summary-val">QRIS</span>
          </div>
          <div class="summary-row">
            <span>Total Harga</span>
            <span id="sum-price" class="summary-val">Rp 0</span>
          </div>
        </div>

        <button type="submit" class="btn-wa">Pesan Sekarang via WhatsApp</button>
      </form>
    </section>
  </main>

  <script>
    const WA_NUMBER = "6281234567890"; // Ganti dengan nomor WhatsApp admin kamu

    const FALLBACK_ART =
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="340" viewBox="0 0 320 340">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#090d16"/></linearGradient></defs>
        <rect width="320" height="340" fill="url(#g)"/>
        <text x="160" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="#e2e8f0">KABUKI JOKI</text>
      </svg>`);

    const SERVICES = {
      "joki-rank": {
        title: "Joki Rank",
        sub: "Jasa Joki (Up Rank)",
        cat: "joki-ml",
        catLabel: "Joki ML",
        image: "1795684016988.png",
        note: "Pastikan verifikasi akun dua langkah (2FA) dimatikan sementara saat proses joki berlangsung, atau pilih Mabar jika tidak ingin akun di-login."
      },
      "joki-hero-mmr": {
        title: "Jasa Joki Ranked",
        sub: "1 Hero (Up MMR)",
        cat: "joki-ml",
        catLabel: "Joki ML",
        image: "1795684363565.png",
        note: "Fokus push MMR untuk 1 hero pilihan. Cantumkan nama hero target di kolom catatan."
      },
      "jasa-gendong": {
        title: "Jasa Mabar / Gendong",
        sub: "Party Bareng Pro",
        cat: "joki-ml",
        catLabel: "Joki ML",
        image: "1795684340955.png",
        note: "Main bareng tim/joki tanpa perlu menyerahkan password akun. Siapkan ID & nickname saat antrean dimulai."
      },
      "joki-classic": {
        title: "Joki Classic",
        sub: "Up Winrate Hero",
        cat: "joki-ml",
        catLabel: "Joki ML",
        image: "file_00000000fde082118279351be4988263.webp",
        note: "Bantu naikkan winrate hero/akun di mode Classic sesuai paket match yang dipilih."
      },
      "joki-magic-chess": {
        title: "Joki Magic Chess",
        sub: "Push Rank Magic Chess",
        cat: "joki-ml",
        catLabel: "Joki ML",
        image: "1795684487111.png",
        note: "Jasa push rank mode Magic Chess secara aman dan bertahap."
      },
      "joki-montage": {
        title: "Joki Video Montage",
        sub: "Jasa Video Highlight",
        cat: "joki-ml",
        catLabel: "Joki ML",
        image: "1795684433125.png",
        note: "Pembuatan video highlight/montage gameplay MLBB. Kirimkan ID/replay atau catatan konsep di catatan pesanan."
      },
      "topup-mlbb": {
        title: "Mobile Legends",
        sub: "Moonton • Diamonds",
        cat: "topup-game",
        catLabel: "Top Up Game",
        needZone: true,
        image: "logomlbbck-ezgif.jpeg",
        note: "Masukkan User ID dan Zone ID dengan benar. Diamonds / WDP masuk otomatis sesuai antrean."
      },
      "topup-ff": {
        title: "Free Fire",
        sub: "Garena • Diamond",
        cat: "topup-game",
        catLabel: "Top Up Game",
        needZone: false,
        image: "a70bfa08-7d18-4c76-927f-409c9c9da0cd.webp",
        note: "Masukkan Player ID Free Fire dengan benar sebelum melanjutkan pembayaran."
      },
      "topup-ff-max": {
        title: "Free Fire Max",
        sub: "Garena • Diamond",
        cat: "topup-game",
        catLabel: "Top Up Game",
        needZone: false,
        image: "1b0847af-a218-4ded-a904-3a6d069dd02e.webp",
        note: "Top up diamond untuk akun Free Fire / Free Fire Max menggunakan Player ID."
      },
      "topup-pubgm": {
        title: "PUBG Mobile",
        sub: "Tencent • UC",
        cat: "topup-game",
        catLabel: "Top Up Game",
        needZone: false,
        image: "3367aa44-bc91-4717-a618-cee872f62b6a.webp",
        note: "Masukkan Character ID PUBG Mobile secara tepat agar UC masuk tanpa kendala."
      },
      "topup-hok": {
        title: "Honor of Kings",
        sub: "Level Infinite • Tokens",
        cat: "topup-game",
        catLabel: "Top Up Game",
        needZone: false,
        image: "661737a7-9770-4086-b8ee-8ecb3311113d.webp",
        note: "Masukkan Player ID Honor of Kings untuk pengisian Tokens."
      },
      "topup-genshin": {
        title: "Genshin Impact",
        sub: "HoYoverse • Crystals",
        cat: "topup-game",
        catLabel: "Top Up Game",
        needZone: true,
        image: "9b0b6393-7fa9-4f8a-ae30-130b2a421d48.webp",
        note: "Masukkan UID dan pilih Server (Asia / America / Europe / TW,HK,MO) dengan tepat."
      }
    };

    const PACKAGES_BY_CAT = {
      "joki-ml": [
        { name: "Paket 5 Bintang", price: 25000 },
        { name: "Paket 10 Bintang", price: 48000 },
        { name: "Paket 20 Bintang", price: 92000 },
        { name: "Paket 30 Bintang", price: 135000 },
        { name: "Paket 50 Bintang", price: 215000 },
        { name: "Custom / Konsultasi", price: 0 }
      ],
      "topup-game": [
        { name: "Weekly Pass / Hemat", price: 28000 },
        { name: "Paket Kecil (86 DM)", price: 22000 },
        { name: "Paket Menengah (172 DM)", price: 44000 },
        { name: "Paket Besar (257 DM)", price: 66000 },
        { name: "Paket Sultan (706 DM)", price: 178000 },
        { name: "Custom Nominal", price: 0 }
      ]
    };

    const params = new URLSearchParams(window.location.search);
    const serviceId = params.get("id") || "joki-rank";
    const service = SERVICES[serviceId] || SERVICES["joki-rank"];
    const packages = PACKAGES_BY_CAT[service.cat] || PACKAGES_BY_CAT["joki-ml"];

    let selectedPkg = packages[0];

    const svcImg = document.getElementById("svc-img");
    const svcCat = document.getElementById("svc-cat");
    const svcTitle = document.getElementById("svc-title");
    const svcSub = document.getElementById("svc-sub");
    const svcNote = document.getElementById("svc-note");
    const pkgGrid = document.getElementById("pkg-grid");

    const topupFields = document.getElementById("topup-fields");
    const jokiFields = document.getElementById("joki-fields");
    const zoneWrap = document.getElementById("zone-wrap");
    const gameIdInput = document.getElementById("game-id");
    const zoneIdInput = document.getElementById("zone-id");
    const mlIdServerInput = document.getElementById("ml-id-server");
    const loginViaSelect = document.getElementById("login-via");
    const emailPassInput = document.getElementById("email-pass");
    const waBuyerInput = document.getElementById("wa-buyer");
    const paymentSelect = document.getElementById("payment-method");
    const notesInput = document.getElementById("notes");

    const sumService = document.getElementById("sum-service");
    const sumPkg = document.getElementById("sum-pkg");
    const sumPay = document.getElementById("sum-pay");
    const sumPrice = document.getElementById("sum-price");
    const orderForm = document.getElementById("order-form");

    function formatRupiah(num) {
      if (!num || num <= 0) return "Menyesuaikan";
      return "Rp " + num.toLocaleString("id-ID");
    }

    function initServicePage() {
      document.title = `${service.title} - KABUKI JOKI`;
      svcImg.src = service.image;
      svcImg.alt = service.title;
      svcCat.textContent = service.catLabel;
      svcTitle.textContent = service.title;
      svcSub.textContent = service.sub;
      svcNote.textContent = service.note;

      const isJoki = service.cat === "joki-ml";
      topupFields.classList.toggle("hidden", isJoki);
      jokiFields.classList.toggle("hidden", !isJoki);
      gameIdInput.required = !isJoki;
      mlIdServerInput.required = isJoki;

      if (!isJoki) {
        zoneWrap.classList.toggle("hidden", !service.needZone);
      }

      pkgGrid.innerHTML = packages
        .map(
          (pkg, idx) => `
          <button type="button" class="pkg-btn ${idx === 0 ? "active" : ""}" data-idx="${idx}">
            <div class="pkg-name">${pkg.name}</div>
            <div class="pkg-price">${formatRupiah(pkg.price)}</div>
          </button>
        `
        )
        .join("");

      pkgGrid.querySelectorAll(".pkg-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          pkgGrid.querySelectorAll(".pkg-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          selectedPkg = packages[Number(btn.dataset.idx)];
          updateSummary();
        });
      });

      paymentSelect.addEventListener("change", updateSummary);
      updateSummary();
    }

    function updateSummary() {
      sumService.textContent = service.title;
      sumPkg.textContent = selectedPkg.name;
      sumPay.textContent = paymentSelect.value;
      sumPrice.textContent = formatRupiah(selectedPkg.price);
    }

    orderForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const waBuyer = waBuyerInput.value.trim();
      const payMethod = paymentSelect.value;
      const notes = notesInput.value.trim() || "-";

      let accountLines = "";
      if (service.cat === "joki-ml") {
        const idSrv = mlIdServerInput.value.trim();
        const loginVia = loginViaSelect.value;
        const loginData = emailPassInput.value.trim() || "-";
        accountLines = [
          `ID & Server: ${idSrv}`,
          `Login Via: ${loginVia}`,
          `Detail Akun: ${loginData}`
        ].join("\n");
      } else {
        const gid = gameIdInput.value.trim();
        const zid = zoneIdInput.value.trim();
        accountLines = service.needZone
          ? `User ID: ${gid}\nServer / Zone: ${zid || "-"}`
          : `Player ID: ${gid}`;
      }

      const message = [
        `*ORDER BARU - KABUKI JOKI*`,
        `----------------------------`,
        `Kategori: ${service.catLabel}`,
        `Layanan: ${service.title}`,
        `Paket: ${selectedPkg.name}`,
        `Harga: ${formatRupiah(selectedPkg.price)}`,
        `----------------------------`,
        accountLines,
        `No. WA Pembeli: ${waBuyer}`,
        `Pembayaran: ${payMethod}`,
        `Catatan: ${notes}`
      ].join("\n");

      const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    });

    initServicePage();
  </script>
</body>
</html>
